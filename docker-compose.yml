services:
  pulseguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulseguard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: "3000"
      DATA_DIR: "/app/data"
      ALLOW_PRIVATE_TARGETS: "${ALLOW_PRIVATE_TARGETS:-true}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      CHECK_RETENTION_DAYS: "${CHECK_RETENTION_DAYS:-30}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
    volumes:
      - ./data:/app/data
